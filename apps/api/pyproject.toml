[tool.poetry]
name = "braingui-api"
version = "0.1.0"
description = "BrainGUI FastAPI backend"
authors = ["BrainGUI Team"]
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.6"
uvicorn = {extras = ["standard"], version = "^0.32.1"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic-settings = "^2.7.0"
redis = "^5.2.1"
arq = "^0.26.1"
boto3 = "^1.35.90"
yt-dlp = "^2024.12.13"
httpx = "^0.28.1"
gradio-client = "^1.4.2"
sse-starlette = "^2.1.3"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.6"
mypy = "^1.13.0"
pytest = "^8.3.4"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
